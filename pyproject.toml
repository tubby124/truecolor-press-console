[project]
name = "truecolor-press-console"
version = "0.3.5"
# When bumping: also update backend/version.py __version__ to match. The
# OTA updater compares against `backend.version.__version__`, not pyproject.
description = "Local web app + tray launcher for the shop's Konica AccurioPress C3070"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pikepdf>=9.4",
    "pillow>=11",
    "psd-tools>=1.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pysnmp>=6.2",
    # System-tray icon for the Windows .exe build. pystray pulls in pywin32
    # via its win32 backend; both stay off Mac/Linux dev installs.
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"
