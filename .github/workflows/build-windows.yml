name: Build Windows .exe

# Triggers:
#   - workflow_dispatch: manual run from the Actions tab. Produces the .zip
#     as a downloadable artifact (90-day retention).
#   - tag push (vX.Y.Z): produces the .zip AND attaches it to a GitHub
#     Release named after the tag.
#
# The runner is windows-latest. PyInstaller cannot cross-compile from
# Mac, so this is the only path to a real .exe from a Mac repo.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write   # needed for softprops/action-gh-release on tag push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Ghostscript (chocolatey)
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress
          # Surface the install location so the build script can find it.
          Get-ChildItem "C:\Program Files\gs" -Directory | Format-Table Name

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "pyinstaller>=6.10" "pystray>=0.19" "pywin32>=306"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run build script
        shell: pwsh
        run: .\build\build-windows.ps1
        # Sibling estimator repo isn't checked out on CI — the script falls
        # back to build/vendored/config.v1.csv (committed) for click rates.

      - name: Smoke-check artifact (files exist)
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TrueColorPress\TrueColorPress.exe")) {
            throw "TrueColorPress.exe missing from dist/"
          }
          $zip = Get-ChildItem -Path dist -Filter "TrueColorPress-v*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Versioned zip missing from dist/" }
          Write-Host "==> Built: $($zip.FullName) ($([math]::Round($zip.Length / 1MB, 1)) MB)"

      - name: Boot smoke-test the .exe (server must answer /api/health)
        shell: pwsh
        run: |
          # Actually RUN the frozen exe and prove the server comes up. A build
          # that produces a non-booting exe (missing PyInstaller hidden import,
          # etc.) must FAIL here, not ship to staff. This is the gate that was
          # missing when the v0.3.x builds shipped broken.
          $exe = "dist\TrueColorPress\TrueColorPress.exe"
          $env:PRESS_NO_TRAY        = "1"     # headless runner: no system tray
          $env:PRESS_SAFE_PRINT_MODE = "dry"  # never touch a printer in CI
          $env:PRESS_BIND_HOST      = "127.0.0.1"
          $env:PRESS_BIND_PORT      = "5273"
          Write-Host "==> Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5273/api/health" -TimeoutSec 2 -UseBasicParsing
              if ($r.StatusCode -eq 200 -and $r.Content -match '"ok":\s*true') { $ok = $true; break }
            } catch { }
          }
          $log = "dist\TrueColorPress\data\logs\server.log"
          if (Test-Path $log) {
            Write-Host "==== server.log (tail) ===="
            Get-Content $log -Tail 80
          } else {
            Write-Host "(no server.log written — server likely never started)"
          }
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          taskkill /IM TrueColorPress.exe /F /T 2>$null | Out-Null
          if (-not $ok) {
            throw "Boot smoke-test FAILED: /api/health never returned ok within 30s. The exe does not boot — see server.log above."
          }
          Write-Host "==> Boot smoke-test PASSED: server answered /api/health"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueColorPress-windows
          path: dist/TrueColorPress-v*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrueColorPress-v*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
